name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 内容数据：结构、双语齐备、年代与坐标、相互引用
      - run: npm run data:lint
      # 类型检查 + 生产构建
      - run: npm run build
